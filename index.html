<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AA Workshop Portal</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    
    <style>
        :root {
            --bg-body: #FFD8A8; --bg-staff: #FFC0CB; --glass: rgba(255, 255, 255, 0.4);
            --text-main: #2d3436; --available: #6fdc6f; --booked: #e36b6b; --arrived: #2196F3;
            --urgent: #ff4757; --maint: #636e72; --input-bg: #ffffff;
            --accent: #2d3436; --border: rgba(255,255,255,0.1);
        }
        .dark-mode {
            --bg-body: #1a1a1b; --bg-staff: #2d1b20; --glass: rgba(45, 45, 45, 0.8);
            --text-main: #f5f6fa; --available: #00b894; --booked: #d63031; --arrived: #0984e3;
            --input-bg: #2d3436; --accent: #f5f6fa; --border: rgba(255,255,255,0.05);
        }

        body { font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; background: var(--bg-body); color: var(--text-main); transition: 0.3s; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
        .staffMode { background: var(--bg-staff) !important; }

        .siren-active .side-card.bulletin { 
            animation: sirenAlert 0.8s infinite alternate; 
            border: 3px solid var(--urgent) !important;
        }
        @keyframes sirenAlert { 
            from { box-shadow: 0 0 5px var(--urgent); } 
            to { box-shadow: 0 0 25px var(--urgent); background: rgba(255, 71, 87, 0.2); } 
        }

        #mainLayout { display: flex; width: 100%; max-width: 1400px; gap: 20px; flex-wrap: wrap; }
        #mainContent { flex: 3; min-width: 300px; text-align: center; }
        #sidebar { flex: 1; min-width: 280px; position: sticky; top: 20px; }
        
        @media (max-width: 768px) {
            #mainLayout { flex-direction: column; }
            #sidebar { order: 2; position: relative; top: 0; }
            #mainContent { order: 1; }
            .grid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); }
        }

        .side-card { margin-bottom: 15px; padding: 20px; border-radius: 16px; background: var(--glass); backdrop-filter: blur(10px); border: 1px solid var(--border); }
        .glass-panel { margin: 10px 0; padding: 20px; border-radius: 16px; background: var(--glass); border: 1px solid var(--border); width: 100%; box-sizing: border-box; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; margin-top: 10px; }
        .bench-container { background: var(--glass); border-radius: 12px; padding: 10px; }
        .slot-seg { height: 36px; border-radius: 6px; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; cursor: pointer; margin-top: 4px; border: none; width: 100%; color: #fff; transition: all 0.2s;}
        .slot-seg:hover { filter: brightness(1.1); }

        .available { background: var(--available); color: #000; }
        .booked { background: var(--booked); }
        .arrived { background: var(--arrived); border: 2px solid gold; }
        .maint { background: var(--maint); }

        input, select, textarea { background: var(--input-bg); color: var(--text-main); border: 1px solid rgba(0,0,0,0.1); padding: 8px; border-radius: 6px; width: 100%; box-sizing: border-box; margin-bottom: 5px; }
        .button { padding: 10px 18px; margin: 4px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; background: var(--text-main); color: var(--bg-body); transition: all 0.2s; }
        .button:hover { transform: translateY(-2px); box-shadow: 0 4px 8px rgba(0,0,0,0.1); }

        #qrDisplay { background: white; padding: 15px; border-radius: 8px; margin-top: 10px; display: none; flex-direction: column; align-items: center; color: #000; }
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; justify-content: center; align-items: center; z-index: 1000; }

        #printArea { display: none; }
        @media print {
            body * { visibility: hidden; }
            #printArea, #printArea * { visibility: visible; display: block; }
            #printArea { position: absolute; left: 0; top: 0; width: 100%; background: white; color: black; padding: 20px; }
            table { width: 100%; border-collapse: collapse; margin-top: 10px; }
            th, td { border: 1px solid #000; padding: 8px; text-align: left; }
        }
    </style>
</head>
<body id="bodyRoot">

<div id="mainLayout">
    <div id="sidebar">
        <div class="side-card bulletin">
            <h3 style="margin-top:0">📢 Notice Board</h3>
            <p id="bulletinText" style="font-size: 14px; line-height: 1.4;">Welcome to the AA Workshop!</p>

            <div id="staffNoticeTools" style="display:none; border-top: 1px solid var(--border); padding-top:10px; margin-top:10px;">
                <textarea id="noticeInput" rows="2" placeholder="Update message..."></textarea>
                <button class="button" style="width:100%; background:#2ecc71; color:white;" onclick="saveNotice()">Update Notice</button>
                <button class="button" style="width:100%; background:#e74c3c; color:white; margin-top:5px;" onclick="toggleSiren()">🚨 Siren Glow</button>
            </div>

            <div id="qrSection" style="display:none; border-top: 1px solid var(--border); padding-top:10px; margin-top:10px;">
                <button class="button" style="width:100%" onclick="toggleQR()">📱 Check-In QR</button>
                <div id="qrDisplay">
                    <div id="qrcode"></div>
                    <p id="qrDesc" style="font-size: 10px; margin-top:8px; font-weight:bold;"></p>
                </div>
            </div>
        </div>

       <div class="side-card">
    <h3 style="margin-top:0">🕒 Waitlist</h3>
    <div id="waitlistContent"></div>
    
    <div id="staffWlInput" style="display:none; margin-top:10px; position: relative;">
        <input type="text" id="wlSearch" placeholder="Search registered student..." oninput="searchUsers(this.value)">
        <div id="searchResults" style="display:none; position:absolute; background:var(--input-bg); width:100%; border:1px solid #ddd; border-radius:4px; z-index:10; max-height:150px; overflow-y:auto; box-shadow:0 4px 6px rgba(0,0,0,0.1); color: #000;"></div>
        <input type="hidden" id="selectedUser">
        <button class="button" id="addWlBtn" style="width:100%; margin-top:5px; opacity:0.5;" onclick="addToWaitlist()" disabled>Add to List</button>
    </div>
</div>

    <div id="mainContent">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <button class="button" onclick="document.body.classList.toggle('dark-mode')">🌓 Night Mode</button>
            <div>
                <button class="button" id="loginBtn" onclick="openLogin()">Student Login</button>
                <button class="button" id="profileBtn" style="display:none;" onclick="openProfile()">👤 Profile</button>
                <button class="button" id="staffBtn" onclick="staffLogin()">Staff Portal</button>
                <button class="button" id="logoutBtn" style="display:none; background:#d63031; color:white;" onclick="logout()">Logout</button>
            </div>
        </div>

        <h1 id="dynamicHeader">Welcome</h1>

        <div id="staffMainTools" class="glass-panel" style="display:none;">
            <button class="button" onclick="printRegister()" style="background:#3498db; color:white;">🖨️ Print Session</button>
            <button class="button" onclick="clearEntireSlot()" style="background:#555; color:white;">🧹 Wipe Session</button>
        </div>

        <div class="glass-panel">
            <label>Date:</label> <select id="dateSelect" style="width:auto" onchange="refreshGrid()"></select>
            <span id="staffSessionUI" style="display:none; margin-left: 15px;">
                <label>Session:</label>
                <select id="slotSelect" style="width:auto" onchange="refreshGrid()">
                    <option>Morning</option><option>Afternoon</option><option>Evening</option>
                </select>
            </span>
        </div>

        <div class="grid-header" style="text-align:left; font-weight:bold; margin-top:20px;">MAIN WORKSHOP (1-20)</div>
        <div class="grid" id="mainGrid"></div>
        <div class="grid-header" style="text-align:left; font-weight:bold; margin-top:30px;">CHING'S YARD (21-25)</div>
        <div class="grid" id="yardGrid"></div>
    </div>
</div>

<div id="printArea"></div>

<div id="loginModal" class="modal">
    <div class="glass-panel" style="background:var(--input-bg); width:320px;">
        <div id="authTabs" style="display:flex; margin-bottom:15px; border-bottom:1px solid #ddd;">
            <button onclick="showAuth('login')" id="tab-login" style="flex:1; border:none; background:none; padding:10px; cursor:pointer; font-weight:bold; border-bottom:2px solid var(--arrived); color:var(--text-main)">Login</button>
            <button onclick="showAuth('signup')" id="tab-signup" style="flex:1; border:none; background:none; padding:10px; cursor:pointer; opacity:0.5; color:var(--text-main)">Sign Up</button>
        </div>

        <div id="loginFields">
            <input type="email" id="loginEmail" placeholder="Email Address">
            <input type="password" id="loginPass" placeholder="Password">
            <button class="button" style="width:100%" onclick="doLogin()">Login</button>
            <p style="text-align:center; font-size:12px; margin-top:10px;">
                <a href="#" onclick="forgotPassword()" style="color:var(--arrived); text-decoration:none;">Forgot Password?</a>
            </p>
        </div>

        <div id="signupFields" style="display:none;">
            <input type="text" id="regFName" placeholder="First Name">
            <input type="text" id="regSName" placeholder="Surname">
            <input type="email" id="regEmail" placeholder="Email Address">
            <input type="password" id="regPass" placeholder="Create Password">
            <button class="button" style="width:100%; background:#2ecc71; color:white;" onclick="doSignUp()">Create Account</button>
        </div>

        <button class="button" style="width:100%; background:#888; color:white; margin-top:5px;" onclick="closeLogin()">Cancel</button>
    </div>
</div>

<div id="profileModal" class="modal">
    <div class="glass-panel" style="background:var(--input-bg); width:350px;">
        <h3 style="margin-top:0">👤 Notification Preferences</h3>
        <p style="font-size:12px; opacity:0.7; margin-bottom:15px;">How should we notify you if you get a spot from the waitlist?</p>
        
        <div style="margin-bottom:15px;">
            <label style="display:block; margin-bottom:5px; font-weight:bold;">Email Notifications</label>
            <input type="email" id="userEmail" placeholder="your.email@aaschool.ac.uk" style="width:100%; margin-bottom:5px;" disabled>
            <label style="display:flex; align-items:center; margin-top:5px; cursor:pointer;">
                <input type="checkbox" id="emailNotif" checked style="margin-right:8px; width:auto;">
                <span style="font-size:14px;">Receive email notifications</span>
            </label>
        </div>
        
        <div style="margin-bottom:20px;">
            <label style="display:flex; align-items:center; cursor:pointer;">
                <input type="checkbox" id="popupNotif" checked style="margin-right:8px; width:auto;">
                <span style="font-size:14px;">Show browser pop-up notifications</span>
            </label>
        </div>
        
        <button class="button" style="width:100%; background:#2ecc71; color:white;" onclick="saveProfile()">Save Preferences</button>
        <button class="button" style="width:100%; background:#888; color:white; margin-top:5px;" onclick="closeProfile()">Close</button>
    </div>
</div>

<script>
    // Initialize EmailJS
    (function(){
       emailjs.init("AT2LZmBWCE6mMkv_A"); 
    })();

    // --- FIREBASE CONFIG ---
    const firebaseConfig = {
      apiKey: "AIzaSyAwJVK297U7my6f0qYTV0NGqGZD7NstbEk",
      authDomain: "aa-workshop-booking.firebaseapp.com",
      projectId: "aa-workshop-booking",
      storageBucket: "aa-workshop-booking.firebasestorage.app",
      messagingSenderId: "194937255422",
      appId: "1:194937255422:web:23a18c6ba4e023645e7caf",
      databaseURL: "https://aa-workshop-booking-default-rtdb.europe-west1.firebasedatabase.app/"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let currentUser = null, isStaff = false;
    const sessionNames = ["Morning", "Afternoon", "Evening"];
    const sessionStarts = { "Morning": "10:00", "Afternoon": "14:00", "Evening": "18:00" };

    window.onload = () => {
        setupDates(); 
        loadAppData();
        checkURLForAutoCheckin();
        setInterval(checkTimeouts, 60000); 
        refreshGrid();
    };

    function setupDates() {
        const ds = document.getElementById("dateSelect");
        for(let i=0; i<5; i++) {
            let d = new Date(); d.setDate(d.getDate() + i);
            if(d.getDay() === 0) continue; 
            let opt = document.createElement("option"); 
            opt.value = d.toISOString().split('T')[0]; opt.text = d.toDateString(); 
            ds.appendChild(opt);
        }
    }

    function loadAppData() {
        db.ref('aa_notice').on('value', (s) => {
            if(s.val()) document.getElementById("bulletinText").innerText = s.val();
        });
        db.ref('aa_siren').on('value', (s) => {
            if(s.val()) document.body.classList.add("siren-active");
            else document.body.classList.remove("siren-active");
        });

        const u = localStorage.getItem("aa_user");
        if(u) {
            currentUser = JSON.parse(u);
            document.getElementById("loginBtn").style.display = "none";
            document.getElementById("staffBtn").style.display = "none";
            document.getElementById("logoutBtn").style.display = "inline-block";
            document.getElementById("profileBtn").style.display = "inline-block";
            document.getElementById("dynamicHeader").innerText = "Welcome, " + currentUser.name.split(' ')[0];
            document.getElementById("qrSection").style.display = "block";
        }
        renderWaitlist();
    }

    // --- AUTHENTICATION & PROFILE FUNCTIONS ---
    function showAuth(type) {
        document.getElementById('loginFields').style.display = type === 'login' ? 'block' : 'none';
        document.getElementById('signupFields').style.display = type === 'signup' ? 'block' : 'none';
        document.getElementById('tab-login').style.opacity = type === 'login' ? '1' : '0.5';
        document.getElementById('tab-signup').style.opacity = type === 'signup' ? '1' : '0.5';
        document.getElementById('tab-login').style.borderBottom = type === 'login' ? '2px solid var(--arrived)' : 'none';
        document.getElementById('tab-signup').style.borderBottom = type === 'signup' ? '2px solid var(--arrived)' : 'none';
    }

    function doSignUp() {
        const f = document.getElementById("regFName").value.trim();
        const s = document.getElementById("regSName").value.trim();
        const email = document.getElementById("regEmail").value.trim();
        const password = document.getElementById("regPass").value;

        if(!f || !s || !email || !password) { alert("Please fill all fields"); return; }

        firebase.auth().createUserWithEmailAndPassword(email, password)
            .then((userCredential) => {
                const user = userCredential.user;
                
                // Save Base Data
                db.ref('users/' + user.uid).set({
                    fullName: f + " " + s,
                    email: email,
                    createdAt: new Date().toISOString()
                });

                // Set Default Notification Preferences
                db.ref('user_profiles/' + user.uid).set({
                    emailNotif: true,
                    popupNotif: true,
                    email: email
                });

                user.sendEmailVerification().then(() => {
                    alert("Account created! A verification email has been sent to " + email + ". Please verify before logging in.");
                    showAuth('login');
                });
            })
            .catch((error) => { alert("Sign Up Error: " + error.message); });
    }

    function doLogin() {
        const email = document.getElementById("loginEmail").value.trim();
        const password = document.getElementById("loginPass").value;

        firebase.auth().signInWithEmailAndPassword(email, password)
            .then((userCredential) => {
                const user = userCredential.user;
                if (!user.emailVerified) {
                    alert("Please verify your email address first! Check your inbox.");
                    firebase.auth().signOut();
                    return;
                }

                db.ref('users/' + user.uid).once('value', (snap) => {
                    const userData = snap.val();
                    currentUser = { 
                        name: userData ? userData.fullName : email, 
                        email: email,
                        uid: user.uid 
                    };
                    localStorage.setItem("aa_user", JSON.stringify(currentUser));
                    location.reload(); 
                });
            })
            .catch((error) => { alert("Login Error: " + error.message); });
    }

    function forgotPassword() {
        const email = document.getElementById("loginEmail").value.trim();
        if (!email) { alert("Please enter your email address in the login box first, then click 'Forgot Password'."); return; }

        firebase.auth().sendPasswordResetEmail(email)
            .then(() => alert("Password reset email sent! Please check your inbox (and spam folder)."))
            .catch((error) => alert("Error: " + error.message));
    }

    function openProfile() { 
        document.getElementById("profileModal").style.display = "flex"; 
        loadProfileData();
    }

    function closeProfile() { document.getElementById("profileModal").style.display = "none"; }

    function loadProfileData() {
        if(!currentUser) return;
        document.getElementById("userEmail").value = currentUser.email; // Keep it fixed to their login email
        
        db.ref('user_profiles/' + currentUser.uid).once('value', (snap) => {
            const profile = snap.val() || {};
            document.getElementById("emailNotif").checked = profile.emailNotif !== false;
            document.getElementById("popupNotif").checked = profile.popupNotif !== false;
        });
    }

    function saveProfile() {
        if(!currentUser) return;
        const profile = {
            email: currentUser.email,
            emailNotif: document.getElementById("emailNotif").checked,
            popupNotif: document.getElementById("popupNotif").checked
        };
        
        db.ref('user_profiles/' + currentUser.uid).set(profile);
        alert("Notification preferences saved!");
        closeProfile();
    }

    // --- GRID, WAITLIST & BOOKING LOGIC ---
    function refreshGrid() {
        const mainG = document.getElementById("mainGrid"), yardG = document.getElementById("yardGrid");
        const d = document.getElementById("dateSelect").value;
        const activeS = document.getElementById("slotSelect").value;

        db.ref(`bookings/${d}`).on('value', (snapshot) => {
            const data = snapshot.val() || {};
            mainG.innerHTML = ""; yardG.innerHTML = "";

            for(let i=1; i<=25; i++) {
                const container = document.createElement("div");
                container.className = "bench-container";
                container.innerHTML = `<div style="font-size:10px; font-weight:bold; opacity:0.7;">BENCH ${i}</div>`;

                sessionNames.forEach(s => {
                    if(isStaff && s !== activeS) return;
                    const b = data[s] ? data[s]['bench'+i] : null;
                    const btn = document.createElement("button");
                    btn.className = "slot-seg " + (b ? (b.type === "maint" ? "maint" : (b.arrived ? "arrived" : "booked")) : "available");
                    btn.innerText = b ? (b.type === "maint" ? "🔧" : b.name.split(' ')[0]) : s;

                    const path = `bookings/${d}/${s}/bench${i}`;
                    btn.onclick = () => isStaff ? handleStaffClick(path, b) : handleStudentClick(path, b, s, d);
                    container.appendChild(btn);
                });
                if(i <= 20) mainG.appendChild(container); else yardG.appendChild(container);
            }
        });
    }

   function handleStaffClick(path, b) {
    const act = prompt("1: Arrived, 2: Clear & Auto-Fill, 3: Maintenance");

    if (act === "1" && b) { 
        db.ref(path).update({ arrived: true }); 
    } 
    else if (act === "2") {
        // This 'remove' now triggers the 'checkWaitlistAndFill' chain reaction
        db.ref(path).remove().then(() => {
            checkWaitlistAndFill(path);
        });
    } 
    else if (act === "3") {
        db.ref(path).set({ type: "maint", name: "SERVICE" });
    }
}

    function handleStudentClick(path, b, s, d) {
    // 1. Security Check: Must be logged in to interact
    if (!currentUser) {
        openLogin();
        return;
    }

    // 2. SCENARIO: The slot is already occupied
    if (b) {
        // Ignore clicks if the bench is under maintenance
        if (b.type === "maint") return;

        // If it's the user's own booking, allow them to cancel
        if (b.email === currentUser.email) {
            if (confirm("Are you sure you want to cancel your booking for " + s + "?")) {
                
                // Remove the booking from Firebase
                db.ref(path).remove().then(() => {
                    // CRITICAL: This is the handshake that pulls the next person from the waitlist
                    checkWaitlistAndFill(path);
                    alert("Booking cancelled. If there was a waitlist, the slot has been filled.");
                }).catch(err => {
                    console.error("Cancellation failed:", err);
                });
            }
        } else {
            alert("This bench is already booked by " + b.name.split(' ')[0]);
        }
    } 
    // 3. SCENARIO: The slot is empty (Available)
    else {
        // Check if the user already has a booking in this specific session (No double-booking)
        db.ref(`bookings/${d}/${s}`).once('value', (snap) => {
            const sessionData = snap.val() || {};
            const hasBooking = Object.values(sessionData).some(booking => booking.email === currentUser.email);

            if (hasBooking) {
                alert("You already have a bench booked for this session!");
                return;
            }

            // Create the booking entry
            const bookingData = {
                name: currentUser.name,
                email: currentUser.email,
                uid: currentUser.uid,
                arrived: false
            };

            // Save to Firebase
            db.ref(path).set(bookingData).then(() => {
                // Send confirmation email via EmailJS
                const benchLabel = "Bench " + path.split('bench')[1];
                sendBookingEmail({
                    bench: benchLabel,
                    date: d,
                    session: s
                });
                alert("Successfully booked " + benchLabel + "!");
            }).catch(err => {
                alert("Booking failed: " + err.message);
            });
        });
    }
}
    // Waitlist Logic Integration
 function checkWaitlistAndFill(path) {
    console.log("Checking waitlist for slot:", path);
    
    db.ref('aa_waitlist').once('value', (snap) => {
        let list = snap.val() || [];
        
        if (list.length > 0) {
            // 1. Pick the first person
            const nextStudent = list.shift(); 
            console.log("Moving student:", nextStudent.name);

            // 2. Remove that person from the waitlist in the database
            db.ref('aa_waitlist').set(list).then(() => {
                
                // 3. Place that person into the now-empty bench slot
                db.ref(path).set({
                    name: nextStudent.name,
                    email: nextStudent.email,
                    uid: nextStudent.uid,
                    arrived: false
                }).then(() => {
                    // 4. Send the notification
                    const pathParts = path.split('/');
                    const benchLabel = "Bench " + pathParts[3].replace('bench', '');
                    
                    if (typeof sendWaitlistNotification === "function") {
                        sendWaitlistNotification(nextStudent, {
                            bench: benchLabel,
                            session: pathParts[2],
                            date: pathParts[1]
                        });
                    }
                    alert(`Slot filled automatically by ${nextStudent.name}!`);
                });
            });
        } else {
            console.log("Waitlist is empty. Slot remains available.");
        }
    });
}
    function sendWaitlistNotification(userObj, details) {
        const msg = `🎉 Workshop Update: You have been assigned ${details.bench} for ${details.session} on ${details.date}.`;
        
        // If staff manually typed their name, we might not have a UID. Send general popup.
        if(!userObj.uid) {
            if("Notification" in window && Notification.permission === "granted") {
                new Notification("AA Workshop - " + userObj.name, { body: msg });
            }
            return;
        }

        // If they have an account, check their preferences
        db.ref('user_profiles/' + userObj.uid).once('value', (snap) => {
            const prefs = snap.val() || { popupNotif: true, emailNotif: true, email: userObj.email };
            
            // 1. Popup
            if(prefs.popupNotif && "Notification" in window) {
                if(Notification.permission === "granted") {
                    new Notification("AA Workshop", { body: msg });
                } else if(Notification.permission !== "denied") {
                    Notification.requestPermission().then(p => {
                        if(p === "granted") new Notification("AA Workshop", { body: msg });
                    });
                }
            }

            // 2. Real EmailJS Integration
            if(prefs.emailNotif && prefs.email) {
                emailjs.send('service_ms1erxl', 'template_xn7kjya', {
                    user_name: userObj.name,
                    user_email: prefs.email,
                    bench_no: details.bench,
                    date: details.date,
                    session: details.session
                }).then(() => console.log('Waitlist confirmation email sent via EmailJS!'))
                  .catch((err) => console.error('Email error:', err));
            }
        });
    }

    function renderWaitlist() {
        db.ref('aa_waitlist').on('value', (snap) => {
            const cont = document.getElementById("waitlistContent"), list = snap.val() || [];
            cont.innerHTML = list.length ? "" : "<p style='font-size:12px; opacity:0.6;'>No one waiting.</p>";
            list.forEach((item, idx) => {
                const div = document.createElement("div");
                div.style.cssText = "background:rgba(0,0,0,0.05); margin:5px 0; padding:8px; border-radius:8px; display:flex; justify-content:space-between; font-size:12px;";
                div.innerHTML = `<span><b>${item.name}</b> <small style="opacity:0.6">(${item.time})</small></span>`;
                if(isStaff) {
                    const del = document.createElement("span"); del.innerText = "×"; del.style.cssText="cursor:pointer; color:red; font-weight:bold;";
                    del.onclick = () => { list.splice(idx,1); db.ref('aa_waitlist').set(list); };
                    div.appendChild(del);
                }
                cont.appendChild(div);
            });
        });
    }

  function addToWaitlist() {
    const userDataStr = document.getElementById("selectedUser").value;
    if(!userDataStr) return;
    
    const user = JSON.parse(userDataStr);
    
    db.ref('aa_waitlist').once('value', (snap) => {
        let list = snap.val() || [];
        
        // Prevent duplicates
        if(list.some(item => item.uid === user.uid)) {
            alert("Student is already on the waitlist.");
            return;
        }

        list.push({
            name: user.name,
            uid: user.uid,
            email: user.email,
            time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
        });
        
        db.ref('aa_waitlist').set(list);
        
        // Reset the search UI
        document.getElementById("wlSearch").value = "";
        document.getElementById("selectedUser").value = "";
        document.getElementById("addWlBtn").disabled = true;
        document.getElementById("addWlBtn").style.opacity = "0.5";
    });
}
    function sendBookingEmail(bookingDetails) {
        const templateParams = {
            user_name: currentUser.name,
            user_email: currentUser.email,
            bench_no: bookingDetails.bench,
            date: bookingDetails.date,
            session: bookingDetails.session
        };

        emailjs.send('service_ms1erxl', 'template_xn7kjya', templateParams)
            .then(() => console.log('Confirmation email sent!'))
            .catch((err) => console.error('Email error:', err));
    }
function searchUsers(query) {
    const resultsDiv = document.getElementById("searchResults");
    const addBtn = document.getElementById("addWlBtn");
    
    if (query.length < 1) {
        resultsDiv.style.display = "none";
        return;
    }

    // This queries your Firebase 'users' node for matches
    db.ref('users').orderByChild('fullName').startAt(query).endAt(query + "\uf8ff").once('value', (snap) => {
        const users = snap.val();
        resultsDiv.innerHTML = "";
        
        if (users) {
            resultsDiv.style.display = "block";
            Object.keys(users).forEach(uid => {
                const user = users[uid];
                const div = document.createElement("div");
                div.style.cssText = "padding:8px; cursor:pointer; border-bottom:1px solid #eee; background: white; color: black;";
                div.innerText = user.fullName;
                div.onclick = () => {
                    document.getElementById("wlSearch").value = user.fullName;
                    document.getElementById("selectedUser").value = JSON.stringify({
                        uid: uid,
                        name: user.fullName,
                        email: user.email
                    });
                    resultsDiv.style.display = "none";
                    addBtn.disabled = false;
                    addBtn.style.opacity = "1";
                };
                resultsDiv.appendChild(div);
            });
        } else {
            resultsDiv.style.display = "none";
        }
    });
}

function checkWaitlistAndFill(path) {
    db.ref('aa_waitlist').once('value', (snap) => {
        const list = snap.val() || [];
        
        if (list.length > 0) {
            const nextStudent = list.shift(); // Takes the person at the top
            
            db.ref('aa_waitlist').set(list); // Updates waitlist
            
            // Fills the empty bench slot
            db.ref(path).set({
                name: nextStudent.name,
                email: nextStudent.email,
                uid: nextStudent.uid,
                arrived: false
            }).then(() => {
                // Notifies them via EmailJS
                const pathParts = path.split('/');
                const benchName = "Bench " + pathParts[3].replace('bench', '');
                
                sendWaitlistNotification(nextStudent, {
                    bench: benchName,
                    session: pathParts[2],
                    date: pathParts[1]
                });
            });
        }
    });
}

document.addEventListener('click', (e) => {

        document.getElementById("searchResults").style.display = "none";

    // --- UTILITY & STAFF FUNCTIONS ---
  function checkTimeouts() {
    const today = new Date().toISOString().split('T')[0];
    const now = new Date();
    sessionNames.forEach(s => {
        const [h, m] = sessionStarts[s].split(":");
        const limit = new Date(); limit.setHours(parseInt(h), parseInt(m) + 30, 0);
        
        if (now > limit) {
            db.ref(`bookings/${today}/${s}`).once('value', (snap) => {
                const sessionData = snap.val() || {};
                Object.keys(sessionData).forEach(benchKey => {
                    const b = sessionData[benchKey];
                    // If they haven't arrived 30 mins after start...
                    if(b && b.type !== "maint" && !b.arrived) {
                        const path = `bookings/${today}/${s}/${benchKey}`;
                        // Delete them and trigger waitlist fill
                        db.ref(path).remove().then(() => {
                            checkWaitlistAndFill(path);
                        });
                    }
                });
            });
        }
    });
}

    function staffLogin() {
        if(prompt("PIN:") === "workshop123") {
            isStaff = true; document.body.classList.add("staffMode");
            document.getElementById("staffSessionUI").style.display = "inline-block"; 
            document.getElementById("staffMainTools").style.display = "block";
            document.getElementById("staffNoticeTools").style.display = "block";
            document.getElementById("staffWlInput").style.display = "block";
            document.getElementById("qrSection").style.display = "block";
            document.getElementById("loginBtn").style.display = "none"; 
            document.getElementById("staffBtn").style.display = "none";
            document.getElementById("logoutBtn").style.display = "inline-block"; 
            refreshGrid(); renderWaitlist();
        }
    }

    function saveNotice() { db.ref('aa_notice').set(document.getElementById("noticeInput").value); }
    function toggleSiren() { db.ref('aa_siren').once('value', snap => db.ref('aa_siren').set(!snap.val())); }
    
    function toggleQR() {
        const q = document.getElementById("qrDisplay");
        q.style.display = (q.style.display === "flex") ? "none" : "flex";
        if(q.style.display === "flex") {
            document.getElementById("qrcode").innerHTML = "";
            new QRCode(document.getElementById("qrcode"), { text: window.location.href.split('?')[0] + "?checkin=true", width: 140, height: 140 });
            document.getElementById("qrDesc").innerText = isStaff ? "WALL CHECK-IN" : "MY ID";
        }
    }

    function checkURLForAutoCheckin() {
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('checkin') && currentUser) {
            const today = new Date().toISOString().split('T')[0];
            const h = new Date().getHours();
            let s = (h < 13) ? "Morning" : (h < 17) ? "Afternoon" : "Evening";
            
            db.ref(`bookings/${today}/${s}`).once('value', (snap) => {
                const data = snap.val() || {};
                const benchKey = Object.keys(data).find(key => data[key].email === currentUser.email);
                if(benchKey) {
                    db.ref(`bookings/${today}/${s}/${benchKey}`).update({arrived: true});
                    alert("Checked in!"); window.history.replaceState({}, document.title, window.location.pathname);
                }
            });
        }
    }

    function printRegister() {
        const d = document.getElementById("dateSelect").value;
        const s = document.getElementById("slotSelect").value;
        db.ref(`bookings/${d}/${s}`).once('value', (snap) => {
            const data = snap.val() || {};
            let tableHtml = `<h2>AA Workshop Register - ${d} (${s})</h2>`;
            tableHtml += `<table><thead><tr><th>Bench</th><th>Name</th><th>Status</th></tr></thead><tbody>`;
            for(let i=1; i<=25; i++) {
                const b = data['bench'+i];
                const status = b ? (b.arrived ? "PRESENT" : (b.type === "maint" ? "SERVICE" : "ABSENT")) : "EMPTY";
                tableHtml += `<tr><td>Bench ${i}</td><td>${b ? b.name : "-"}</td><td>${status}</td></tr>`;
            }
            tableHtml += `</tbody></table>`;
            document.getElementById("printArea").innerHTML = tableHtml;
            window.print();
        });
    }

    function clearEntireSlot() {
        const d = document.getElementById("dateSelect").value;
        const s = document.getElementById("slotSelect").value;
        if(confirm(`Are you sure you want to WIPE all bookings for ${s}?`)) {
            db.ref(`bookings/${d}/${s}`).remove();
        }
    }

    function openLogin() { document.getElementById("loginModal").style.display = "flex"; }
    function closeLogin() { document.getElementById("loginModal").style.display = "none"; }
    function logout() { firebase.auth().signOut(); localStorage.removeItem("aa_user"); location.reload(); }
