<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AA Workshop Portal</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --bg-body: #ffffff; --bg-staff: #f5f5f; --glass: rgba(0, 0, 0, 0.1);
            --text-main: #000000; --available: #00a650; --booked: #dc3545; --arrived: #007bff;
            --urgent: #dc3545; --maint: #6c757d; --input-bg: #ffffff;
            --accent: #000000; --border: #dee2e6;
        }
        .dark-mode {
            --bg-body: #1a1a1a; --bg-staff: #2d1b20; --glass: rgba(45, 45, 45, 0.9);
            --text-main: #ffffff; --available: #00a650; --booked: #dc3545; --arrived: #007bff;
            --input-bg: #2d3436; --accent: #ffffff; --border: #495057;
        }

        body { font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; background: var(--bg-body); color: var(--text-main); transition: 0.3s; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
        .staffMode { background: var(--bg-staff) !important; }

        .siren-active .side-card.bulletin { 
            animation: sirenAlert 0.8s infinite alternate; 
            border: 3px solid var(--urgent) !important;
        }
        @keyframes sirenAlert { 
            from { box-shadow: 0 0 5px var(--urgent); } 
            to { box-shadow: 0 0 25px var(--urgent); background: rgba(255, 71, 87, 0.2); } 
        }

        #mainLayout { display: flex; width: 100%; max-width: 1400px; gap: 20px; flex-wrap: wrap; }
        #mainContent { flex: 3; min-width: 300px; text-align: center; }
        #sidebar { flex: 1; min-width: 280px; position: relative; }
        
        @media (max-width: 768px) {
            #mainLayout { flex-direction: column; }
            #sidebar { order: 2; }
            #mainContent { order: 1; }
            .grid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); }
            .slot-seg { font-size: 9px; height: 32px; }
        }
        
        .side-card { margin-bottom: 20px; padding: 24px; border-radius: 8px; background: var(--glass); border: 1px solid var(--border); backdrop-filter: blur(10px); }
        .glass-panel { margin: 15px 0; padding: 24px; border-radius: 8px; background: var(--glass); border: 1px solid var(--border); width: 100%; box-sizing: border-box; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; margin-top: 10px; }
        .bench-container { background: var(--glass); border-radius: 12px; padding: 10px; }
        .slot-seg { height: 36px; border-radius: 6px; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; cursor: pointer; margin-top: 4px; border: 1px solid var(--border); width: 100%; color: #fff; transition: all 0.2s; }
        
        .available { background: var(--available); color: #000; border: 1px solid var(--border); }
        .booked { background: var(--booked); border: 1px solid var(--border); }
        .arrived { background: var(--arrived); border: 2px solid gold; }
        .maint { background: var(--maint); border: 1px solid var(--border); }

        input, select, textarea { background: var(--input-bg); color: var(--text-main); border: 1px solid rgba(0,0,0,0.1); padding: 8px; border-radius: 6px; width: 100%; box-sizing: border-box; margin-bottom: 5px; }
        .button { padding: 12px 24px; margin: 4px; border: 1px solid var(--border); border-radius: 4px; cursor: pointer; font-weight: 600; background: var(--accent); color: var(--bg-body); transition: all 0.2s; text-transform: uppercase; letter-spacing: 0.5px; }
        .button:hover { transform: translateY(-2px); box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        
        #qrDisplay { background: white; padding: 15px; border-radius: 8px; margin-top: 10px; display: none; flex-direction: column; align-items: center; color: #000; }
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; justify-content: center; align-items: center; z-index: 1000; }

        #printArea { display: none; }
        @media print {
            body * { visibility: hidden; }
            #printArea, #printArea * { visibility: visible; display: block; }
            #printArea { position: absolute; left: 0; top: 0; width: 100%; background: white; color: black; padding: 20px; }
            table { width: 100%; border-collapse: collapse; margin-top: 10px; }
            th, td { border: 1px solid #000; padding: 8px; text-align: left; }
        }
    </style>
</head>
<body id="bodyRoot">

<div id="mainLayout">
    <div id="sidebar">
        <div class="side-card bulletin">
            <h3 style="margin-top:0">📢 Notice Board</h3>
            <p id="bulletinText" style="font-size: 14px; line-height: 1.4;">Welcome to the AA Workshop!</p>
            
            <div id="staffNoticeTools" style="display:none; border-top: 1px solid rgba(0,0,0,0.1); padding-top:10px; margin-top:10px;">
                <textarea id="noticeInput" rows="2" placeholder="Update message..."></textarea>
                <button class="button" style="width:100%; background:#2ecc71; color:white;" onclick="saveNotice()">Update Notice</button>
                <button class="button" style="width:100%; background:#e74c3c; color:white; margin-top:5px;" onclick="toggleSiren()">🚨 Siren Glow</button>
            </div>

            <div id="qrSection" style="display:none; border-top: 1px solid rgba(0,0,0,0.1); padding-top:10px; margin-top:10px;">
                <button class="button" style="width:100%" onclick="toggleQR()">📱 Check-In QR</button>
                <div id="qrDisplay">
                    <div id="qrcode"></div>
                    <p id="qrDesc" style="font-size: 10px; margin-top:8px; font-weight:bold;"></p>
                </div>
            </div>
        </div>

        <div class="side-card">
            <h3 style="margin-top:0">🕒 Waitlist</h3>
            <div id="waitlistContent"></div>
            <div id="staffWlInput" style="display:none; margin-top:10px;">
                <input type="text" id="wlName" placeholder="Student Name">
                <button class="button" style="width:100%; margin-top:5px;" onclick="addToWaitlist()">Add to List</button>
            </div>
        </div>
    </div>

    <div id="mainContent">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <button class="button" onclick="document.body.classList.toggle('dark-mode')">🌓 Night Mode</button>
            <div>
                <button class="button" id="loginBtn" onclick="openLogin()">Student Login</button>
                <button class="button" id="profileBtn" style="display:none;" onclick="openProfile()">👤 Profile</button>
                <button class="button" id="staffBtn" onclick="staffLogin()">Staff Portal</button>
                <button class="button" id="logoutBtn" style="display:none; background:#d63031; color:white;" onclick="logout()">Logout</button>
            </div>
        </div>

        <h1 id="dynamicHeader">Welcome</h1>

        <div id="staffMainTools" class="glass-panel" style="display:none;">
            <button class="button" onclick="printRegister()" style="background:#3498db; color:white;">🖨️ Print Session</button>
            <button class="button" onclick="clearEntireSlot()" style="background:#555; color:white;">🧹 Wipe Session</button>
        </div>

        <div class="glass-panel">
            <label>Date:</label> <select id="dateSelect" style="width:auto" onchange="refreshGrid()"></select>
            <span id="staffSessionUI" style="display:none; margin-left: 15px;">
                <label>Session:</label>
                <select id="slotSelect" style="width:auto" onchange="refreshGrid()">
                    <option>Morning</option><option>Afternoon</option><option>Evening</option>
                </select>
            </span>
        </div>

        <div class="grid-header" style="text-align:left; font-weight:bold; margin-top:20px;">MAIN WORKSHOP (1-20)</div>
        <div class="grid" id="mainGrid"></div>
        <div class="grid-header" style="text-align:left; font-weight:bold; margin-top:30px;">CHING'S YARD (21-25)</div>
        <div class="grid" id="yardGrid"></div>
    </div>
</div>

<div id="printArea"></div>

<div id="loginModal" class="modal">
    <div class="glass-panel" style="background:var(--input-bg); width:300px;">
        <h3 style="margin-top:0">Student Login</h3>
        <input type="text" id="fName" placeholder="First Name">
        <input type="text" id="sName" placeholder="Surname">
        <input type="password" id="loginPass" placeholder="Password">
        <button class="button" style="width:100%" onclick="doLogin()">Enter</button>
        <button class="button" style="width:100%; background:#888; color:white; margin-top:5px;" onclick="closeLogin()">Cancel</button>
    </div>
</div>

<div id="profileModal" class="modal">
    <div class="glass-panel" style="background:var(--input-bg); width:350px;">
        <h3 style="margin-top:0">👤 Notification Preferences</h3>
        <p style="font-size:12px; opacity:0.7; margin-bottom:15px;">Choose how you want to be notified when you get a spot from the waitlist:</p>
        
        <div style="margin-bottom:15px;">
            <label style="display:block; margin-bottom:5px; font-weight:bold;">Email Notifications</label>
            <input type="email" id="userEmail" placeholder="your.email@aaschool.ac.uk" style="width:100%; margin-bottom:5px;">
            <label style="display:flex; align-items:center; margin-top:5px;">
                <input type="checkbox" id="emailNotif" checked style="margin-right:8px;">
                <span>Receive email notifications</span>
            </label>
        </div>
        
        <div style="margin-bottom:15px;">
            <label style="display:block; margin-bottom:5px; font-weight:bold;">Text Notifications</label>
            <input type="tel" id="userPhone" placeholder="+44 7700 900000" style="width:100%; margin-bottom:5px;">
            <label style="display:flex; align-items:center; margin-top:5px;">
                <input type="checkbox" id="smsNotif" style="margin-right:8px;">
                <span>Receive text notifications</span>
            </label>
        </div>
        
        <div style="margin-bottom:20px;">
            <label style="display:flex; align-items:center;">
                <input type="checkbox" id="popupNotif" checked style="margin-right:8px;">
                <span>Show browser pop-up notifications</span>
            </label>
        </div>
        
        <button class="button" style="width:100%; background:#2ecc71; color:white;" onclick="saveProfile()">Save Preferences</button>
        <button class="button" style="width:100%; background:#888; color:white; margin-top:5px;" onclick="closeProfile()">Close</button>
    </div>
</div>

<script>
// --- FIREBASE CONFIG ---
const firebaseConfig = {
  apiKey: "AIzaSyAwJVK297U7my6f0qYTV0NGqGZD7NstbEk",
  authDomain: "aa-workshop-booking.firebaseapp.com",
  projectId: "aa-workshop-booking",
  storageBucket: "aa-workshop-booking.firebasestorage.app",
  messagingSenderId: "194937255422",
  appId: "1:194937255422:web:23a18c6ba4e023645e7caf",
  databaseURL: "https://aa-workshop-booking-default-rtdb.firebaseio.com"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let currentUser = null, isStaff = false;
const sessionNames = ["Morning", "Afternoon", "Evening"];
const sessionStarts = { "Morning": "10:00", "Afternoon": "14:00", "Evening": "18:00" };

window.onload = () => {
    setupDates(); 
    loadAppData();
    checkURLForAutoCheckin();
    setInterval(checkTimeouts, 60000); 
    refreshGrid(); // Data is now real-time, no need for refresh interval
};

function setupDates() {
    const ds = document.getElementById("dateSelect");
    for(let i=0; i<5; i++) {
        let d = new Date(); d.setDate(d.getDate() + i);
        if(d.getDay() === 0) continue; 
        let opt = document.createElement("option"); 
        opt.value = d.toISOString().split('T')[0]; opt.text = d.toDateString(); 
        ds.appendChild(opt);
    }
}

function loadAppData() {
    // Sync Notice Board from Cloud
    db.ref('aa_notice').on('value', (s) => {
        if(s.val()) document.getElementById("bulletinText").innerText = s.val();
    });
    // Sync Siren from Cloud
    db.ref('aa_siren').on('value', (s) => {
        if(s.val()) document.body.classList.add("siren-active");
        else document.body.classList.remove("siren-active");
    });

    const u = localStorage.getItem("aa_user");
    if(u) {
        currentUser = JSON.parse(u);
        document.getElementById("loginBtn").style.display = "none";
        document.getElementById("staffBtn").style.display = "none";
        document.getElementById("logoutBtn").style.display = "inline-block";
        document.getElementById("profileBtn").style.display = "inline-block";
        document.getElementById("dynamicHeader").innerText = "Welcome, " + currentUser.name.split(' ')[0];
        document.getElementById("qrSection").style.display = "block";
    }
    renderWaitlist();
}

function refreshGrid() {
    const mainG = document.getElementById("mainGrid"), yardG = document.getElementById("yardGrid");
    const d = document.getElementById("dateSelect").value;
    const activeS = document.getElementById("slotSelect").value;
    
    // Connect to Real-time Cloud Data
    db.ref(`bookings/${d}`).on('value', (snapshot) => {
        const data = snapshot.val() || {};
        mainG.innerHTML = ""; yardG.innerHTML = "";

        for(let i=1; i<=25; i++) {
            const container = document.createElement("div");
            container.className = "bench-container";
            container.innerHTML = `<div style="font-size:10px; font-weight:bold; opacity:0.7;">BENCH ${i}</div>`;
            
            sessionNames.forEach(s => {
                if(isStaff && s !== activeS) return;
                const b = data[s] ? data[s]['bench'+i] : null;
                const btn = document.createElement("button");
                btn.className = "slot-seg " + (b ? (b.type === "maint" ? "maint" : (b.arrived ? "arrived" : "booked")) : "available");
                btn.innerText = b ? (b.type === "maint" ? "🔧" : b.name.split(' ')[0]) : s;
                
                // Key construction for Firebase
                const path = `bookings/${d}/${s}/bench${i}`;
                btn.onclick = () => isStaff ? handleStaffClick(path, b) : handleStudentClick(path, b, s, d);
                container.appendChild(btn);
            });
            if(i <= 20) mainG.appendChild(container); else yardG.appendChild(container);
        }
    });
}

function checkWaitlistAndFill(path) {
    db.ref('aa_waitlist').once('value', (snap) => {
        let list = snap.val() || [];
        if (list.length > 0) {
            let nextInLine = list.shift();
            let bookingTime = new Date().toISOString();
            let newBooking = { 
                name: nextInLine.name, 
                email: "waitlist-" + Date.now(), 
                arrived: false,
                bookedFromWaitlist: true,
                bookingTime: bookingTime,
                arrivalDeadline: new Date(Date.now() + 10 * 60 * 1000).toISOString() // 10 minutes from now
            };
            db.ref(path).set(newBooking);
            db.ref('aa_waitlist').set(list);
            
            // Extract session info from path for notification
            const pathParts = path.split('/');
            const date = pathParts[1];
            const session = pathParts[2];
            const bench = pathParts[3];
            
            // Send notification to the user
            sendWaitlistNotification(nextInLine.name, {
                bench: bench.replace('bench', ''),
                session: session,
                date: date,
                deadline: new Date(Date.now() + 10 * 60 * 1000).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})
            });
            
            // Show notification to staff if logged in
            if(isStaff) {
                alert(`🎉 ${nextInLine.name} has been automatically booked from waitlist!\nBench: ${bench.replace('bench', '')}\nSession: ${session}\nDate: ${date}\n⏰ Has 10 minutes to arrive!`);
            }
        }
    });
}

function handleStaffClick(path, b) {
    const act = prompt("1: Arrived, 2: Clear Bench, 3: Maintenance");
    if(act === "1" && b) { 
        db.ref(path).update({arrived: true}); 
    }
    else if(act === "2") {
        db.ref(path).remove();
        checkWaitlistAndFill(path);
    }
    else if(act === "3") {
        if(b && b.type === "maint") {
            db.ref(path).remove();
            checkWaitlistAndFill(path);
        } else {
            db.ref(path).set({type: "maint", name: "SERVICE"});
        }
    }
}

function checkTimeouts() {
    const today = new Date().toISOString().split('T')[0];
    const now = new Date();
    sessionNames.forEach(s => {
        const [h, m] = sessionStarts[s].split(":");
        const limit = new Date(); limit.setHours(parseInt(h), parseInt(m) + 30, 0);
        if (now > limit) {
            db.ref(`bookings/${today}/${s}`).once('value', (snap) => {
                const sessionData = snap.val() || {};
                Object.keys(sessionData).forEach(benchKey => {
                    const b = sessionData[benchKey];
                    if(b && b.type !== "maint" && !b.arrived) {
                        const path = `bookings/${today}/${s}/${benchKey}`;
                        db.ref(path).remove();
                        checkWaitlistAndFill(path);
                    }
                });
            });
        }
    });
}

function printRegister() {
    const d = document.getElementById("dateSelect").value;
    const s = document.getElementById("slotSelect").value;
    db.ref(`bookings/${d}/${s}`).once('value', (snap) => {
        const data = snap.val() || {};
        let tableHtml = `<h2>AA Workshop Register - ${d} (${s})</h2>`;
        tableHtml += `<table><thead><tr><th>Bench</th><th>Name</th><th>Status</th></tr></thead><tbody>`;
        for(let i=1; i<=25; i++) {
            const b = data['bench'+i];
            const status = b ? (b.arrived ? "PRESENT" : (b.type === "maint" ? "SERVICE" : "ABSENT")) : "EMPTY";
            tableHtml += `<tr><td>Bench ${i}</td><td>${b ? b.name : "-"}</td><td>${status}</td></tr>`;
        }
        tableHtml += `</tbody></table>`;
        document.getElementById("printArea").innerHTML = tableHtml;
        window.print();
    });
}

function clearEntireSlot() {
    const d = document.getElementById("dateSelect").value;
    const s = document.getElementById("slotSelect").value;
    if(confirm(`Are you sure you want to WIPE all bookings for ${s}?`)) {
        db.ref(`bookings/${d}/${s}`).remove();
    }
}

function staffLogin() {
    if(prompt("PIN:") === "workshop123") {
        isStaff = true; document.body.classList.add("staffMode");
        document.getElementById("staffSessionUI").style.display = "inline-block"; 
        document.getElementById("staffMainTools").style.display = "block";
        document.getElementById("staffNoticeTools").style.display = "block";
        document.getElementById("staffWlInput").style.display = "block";
        document.getElementById("qrSection").style.display = "block";
        document.getElementById("loginBtn").style.display = "none"; 
        document.getElementById("staffBtn").style.display = "none";
        document.getElementById("logoutBtn").style.display = "inline-block"; 
        refreshGrid(); renderWaitlist();
    }
}

function saveNotice() {
    const txt = document.getElementById("noticeInput").value;
    db.ref('aa_notice').set(txt);
}

function toggleSiren() {
    const currentState = document.body.classList.contains("siren-active");
    db.ref('aa_siren').set(!currentState);
}

function addToWaitlist() {
    const n = document.getElementById("wlName").value.trim();
    if(!n) {
        alert("Please enter a valid name.");
        return;
    }
    if(n.length < 2 || n.length > 50) {
        alert("Name must be between 2 and 50 characters.");
        return;
    }
    if(!/^[a-zA-Z\s]+$/.test(n)) {
        alert("Name can only contain letters and spaces.");
        return;
    }
    
    db.ref('aa_waitlist').once('value', (snap) => {
        let list = snap.val() || [];
        // Check for duplicates
        if(list.some(item => item.name.toLowerCase() === n.toLowerCase())) {
            alert("This person is already on the waitlist.");
            return;
        }
        list.push({name: n, time: new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})});
        db.ref('aa_waitlist').set(list);
        document.getElementById("wlName").value = "";
        alert(`${n} has been added to the waitlist. Position: ${list.length}`);
    });
}

function renderWaitlist() {
    db.ref('aa_waitlist').on('value', (snap) => {
        const cont = document.getElementById("waitlistContent"), list = snap.val() || [];
        cont.innerHTML = list.length ? "" : "<p style='font-size:12px; opacity:0.6;'>No one waiting.</p>";
        list.forEach((item, idx) => {
            const div = document.createElement("div");
            div.style.cssText = "background:rgba(0,0,0,0.05); margin:5px 0; padding:8px; border-radius:8px; display:flex; justify-content:space-between; font-size:12px;";
            div.innerHTML = `<span>#${idx + 1} <b>${item.name}</b> <small style="opacity:0.6">(${item.time})</small></span>`;
            if(isStaff) {
                const del = document.createElement("span"); del.innerText = "×"; del.style.cssText="cursor:pointer; color:red; font-weight:bold;";
                del.onclick = () => { list.splice(idx,1); db.ref('aa_waitlist').set(list); };
                div.appendChild(del);
            }
            cont.appendChild(div);
        });
    });
}

function handleStudentClick(path, b, s, d) {
    if(!currentUser) { openLogin(); return; }
    if(b) {
        if(b.type === "maint") return;
        if(b.email === currentUser.email && confirm("Cancel?")) { 
            db.ref(path).remove(() => {
                checkWaitlistAndFill(path);
            });
        }
    } else {
        db.ref(`bookings/${d}/${s}`).once('value', (snap) => {
            const sessionData = snap.val() || {};
            let already = Object.values(sessionData).some(booking => booking.email === currentUser.email);
            if(already) { alert("One bench per session only."); return; }
            db.ref(path).set({...currentUser, arrived: false});
        });
    }
}

function doLogin() {
    const f = document.getElementById("fName").value.trim(), s = document.getElementById("sName").value.trim(), p = document.getElementById("loginPass").value.trim();
    
    // Validation
    if(!f || !s || !p) {
        alert("Please fill in all fields.");
        return;
    }
    if(f.length < 2 || f.length > 30 || s.length < 2 || s.length > 30) {
        alert("Names must be between 2 and 30 characters.");
        return;
    }
    if(!/^[a-zA-Z\s]+$/.test(f) || !/^[a-zA-Z\s]+$/.test(s)) {
        alert("Names can only contain letters and spaces.");
        return;
    }
    if(p.toLowerCase() !== f.toLowerCase()) {
        alert("Password must match your first name (case insensitive).");
        return;
    }
    
    currentUser = { name: f + " " + s, email: f.toLowerCase() + "." + s.toLowerCase() + "@aaschool.ac.uk" };
    localStorage.setItem("aa_user", JSON.stringify(currentUser)); location.reload();
}

function toggleQR() {
    const q = document.getElementById("qrDisplay");
    if (q.style.display === "flex") q.style.display = "none";
    else {
        q.style.display = "flex";
        const checkinURL = window.location.href.split('?')[0] + "?checkin=true";
        document.getElementById("qrcode").innerHTML = "";
        new QRCode(document.getElementById("qrcode"), { text: checkinURL, width: 140, height: 140 });
        document.getElementById("qrDesc").innerText = isStaff ? "WALL CHECK-IN" : "MY ID";
    }
}

function checkURLForAutoCheckin() {
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.has('checkin') && currentUser) {
        const today = new Date().toISOString().split('T')[0];
        const h = new Date().getHours();
        let s = (h < 13) ? "Morning" : (h < 17) ? "Afternoon" : "Evening";
        
        db.ref(`bookings/${today}/${s}`).once('value', (snap) => {
            const data = snap.val() || {};
            const benchKey = Object.keys(data).find(key => data[key].email === currentUser.email);
            if(benchKey) {
                db.ref(`bookings/${today}/${s}/${benchKey}`).update({arrived: true});
                alert("Checked in!"); window.history.replaceState({}, document.title, window.location.pathname);
            }
        });
    }
}

// Notification System Functions

function sendWaitlistNotification(userName, bookingDetails) {
    db.ref('user_profiles').once('value', (snap) => {
        const profiles = snap.val() || {};
        const userProfile = profiles[userName] || {};
        
        const message = `🎉 Workshop Booking Confirmed!\n\nBench: ${bookingDetails.bench}\nSession: ${bookingDetails.session}\nDate: ${bookingDetails.date}\n\n⏰ You have 10 minutes to arrive!\nDeadline: ${bookingDetails.deadline}`;
        
        // Send email notification
        if(userProfile.email && userProfile.emailNotif) {
            sendEmail(userProfile.email, message);
        }
        
        // Send SMS notification
        if(userProfile.phone && userProfile.smsNotif) {
            sendSMS(userProfile.phone, message);
        }
        
        // Send browser popup notification
        if(userProfile.popupNotif) {
            sendBrowserNotification(userName, message);
        }
    });
}

function sendEmail(email, message) {
    // For demo purposes - in production, integrate with email service
    console.log("Email sent to:", email, "Message:", message);
}

function sendSMS(phone, message) {
    // For demo purposes - in production, integrate with SMS service like Twilio
    console.log("SMS sent to:", phone, "Message:", message);
}

function sendBrowserNotification(userName, message) {
    if("Notification" in window && Notification.permission === "granted") {
        new Notification("AA Workshop - " + userName, {
            body: message,
            icon: "https://via.placeholder.com/50"
        });
    } else if("Notification" in window && Notification.permission !== "denied") {
        Notification.requestPermission().then(permission => {
            if(permission === "granted") {
                new Notification("AA Workshop - " + userName, {
                    body: message,
                    icon: "https://via.placeholder.com/50"
                });
            }
        });
    }
}

function loadProfileData() {
    if(!currentUser) return;
    
    db.ref('user_profiles').child(currentUser.name).once('value', (snap) => {
        const profile = snap.val() || {};
        document.getElementById("userEmail").value = profile.email || currentUser.email;
        document.getElementById("userPhone").value = profile.phone || "";
        document.getElementById("emailNotif").checked = profile.emailNotif !== false;
        document.getElementById("smsNotif").checked = profile.smsNotif === true;
        document.getElementById("popupNotif").checked = profile.popupNotif !== false;
    });
}

function saveProfile() {
    if(!currentUser) return;
    
    const profile = {
        email: document.getElementById("userEmail").value,
        phone: document.getElementById("userPhone").value,
        emailNotif: document.getElementById("emailNotif").checked,
        smsNotif: document.getElementById("smsNotif").checked,
        popupNotif: document.getElementById("popupNotif").checked
    };
    
    // Validate email if email notifications are enabled
    if(profile.emailNotif && !profile.email) {
        alert("Please provide an email address to receive email notifications.");
        return;
    }
    
    // Validate phone if SMS notifications are enabled
    if(profile.smsNotif && !profile.phone) {
        alert("Please provide a phone number to receive SMS notifications.");
        return;
    }
    
    db.ref('user_profiles').child(currentUser.name).set(profile);
    localStorage.setItem("aa_profile", JSON.stringify(profile));
    alert("Notification preferences saved!");
    closeProfile();
}

function checkWaitlistAndFill(path) {
    db.ref('aa_waitlist').once('value', (snap) => {
        const list = snap.val() || [];
        if(list.length) {
            const next = list.shift();
            db.ref('aa_waitlist').set(list);
            db.ref(path).set({name: next.name, email: next.email, arrived: false});
            const pathParts = path.split('/');
            const bench = pathParts[2];
            const session = pathParts[1];
            const date = pathParts[0];
            sendWaitlistNotification(next.name, {
                bench: bench.replace('bench', ''),
                session: session,
                date: date,
                deadline: new Date(Date.now() + 10 * 60 * 1000).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})
            });
        }
    });
}
