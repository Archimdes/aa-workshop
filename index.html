<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AA Workshop Portal</title>

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>

:root{
--bg-body:#FFD8A8;
--bg-staff:#FFC0CB;
--glass:rgba(255,255,255,0.4);
--text-main:#2d3436;
--available:#6fdc6f;
--booked:#e36b6b;
--arrived:#2196F3;
--urgent:#ff4757;
--maint:#636e72;
--input-bg:#ffffff;
}

.dark-mode{
--bg-body:#1a1a1b;
--bg-staff:#2d1b20;
--glass:rgba(45,45,45,0.8);
--text-main:#f5f6fa;
--available:#00b894;
--booked:#d63031;
--arrived:#0984e3;
--input-bg:#2d3436;
}

body{
font-family:Segoe UI;
margin:0;
padding:20px;
background:var(--bg-body);
color:var(--text-main);
transition:.3s;
min-height:100vh;
display:flex;
flex-direction:column;
align-items:center;
}

.staffMode{background:var(--bg-staff)!important;}

#mainLayout{
display:flex;
width:100%;
max-width:1400px;
gap:20px;
}

#mainContent{
flex:3;
text-align:center;
}

#sidebar{
flex:1;
min-width:280px;
position:sticky;
top:20px;
}

.side-card{
margin-bottom:15px;
padding:20px;
border-radius:16px;
background:var(--glass);
backdrop-filter:blur(10px);
}

.glass-panel{
margin:10px 0;
padding:20px;
border-radius:16px;
background:var(--glass);
width:100%;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
gap:10px;
margin-top:10px;
}

.bench-container{
background:var(--glass);
border-radius:12px;
padding:10px;
}

.slot-seg{
height:36px;
border-radius:6px;
font-size:11px;
font-weight:700;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
margin-top:4px;
border:none;
width:100%;
color:#fff;
}

.available{background:var(--available);color:#000;}
.booked{background:var(--booked);}
.arrived{background:var(--arrived);border:2px solid gold;}
.maint{background:var(--maint);}

input,select,textarea{
background:var(--input-bg);
color:var(--text-main);
border:1px solid rgba(0,0,0,0.1);
padding:8px;
border-radius:6px;
width:100%;
margin-bottom:5px;
}

.button{
padding:10px 18px;
margin:4px;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:bold;
background:var(--text-main);
color:var(--bg-body);
}

.modal{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.7);
display:none;
justify-content:center;
align-items:center;
z-index:1000;
}

</style>
</head>

<body id="bodyRoot">

<div id="mainLayout">

<div id="sidebar">

<div class="side-card">

<h3>📢 Notice Board</h3>
<p id="bulletinText">Welcome to the AA Workshop!</p>

<div id="staffNoticeTools" style="display:none">

<textarea id="noticeInput" rows="2"></textarea>

<button class="button" onclick="saveNotice()">Update Notice</button>

</div>

<div id="qrSection" style="display:none">

<button class="button" onclick="toggleQR()">Check-In QR</button>

<div id="qrDisplay" style="display:none">

<div id="qrcode"></div>

</div>

</div>

</div>

<div class="side-card">

<h3>Waitlist</h3>

<div id="waitlistContent"></div>

<div id="staffWlInput" style="display:none">

<input id="wlName" placeholder="Student name">

<button class="button" onclick="addToWaitlist()">Add</button>

</div>

</div>

</div>

<div id="mainContent">

<div style="display:flex;justify-content:space-between">

<button class="button" onclick="document.body.classList.toggle('dark-mode')">Night Mode</button>

<div>

<button class="button" id="loginBtn" onclick="openLogin()">Student Login</button>

<button class="button" id="staffBtn" onclick="staffLogin()">Staff Portal</button>

<button class="button" id="logoutBtn" style="display:none" onclick="logout()">Logout</button>

</div>

</div>

<h1 id="dynamicHeader">Welcome</h1>

<div class="glass-panel">

<label>Date</label>

<select id="dateSelect" onchange="refreshGrid()"></select>

<span id="staffSessionUI" style="display:none">

<label>Session</label>

<select id="slotSelect" onchange="refreshGrid()">

<option>Morning</option>
<option>Afternoon</option>
<option>Evening</option>

</select>

</span>

</div>

<div class="grid-header">MAIN WORKSHOP (1-20)</div>

<div class="grid" id="mainGrid"></div>

<div class="grid-header">CHING'S YARD (21-25)</div>

<div class="grid" id="yardGrid"></div>

</div>

</div>

<div id="loginModal" class="modal">

<div class="glass-panel" style="background:white;width:300px">

<h3>Student Login</h3>

<input id="fName" placeholder="First Name">

<input id="sName" placeholder="Surname">

<input id="loginPass" type="password" placeholder="Password">

<button class="button" onclick="doLogin()">Enter</button>

<button class="button" onclick="closeLogin()">Cancel</button>

</div>

</div>

<script>

const firebaseConfig={
apiKey:"AIzaSyAwJVK297U7my6f0qYTV0NGqGZD7NstbEk",
authDomain:"aa-workshop-booking.firebaseapp.com",
databaseURL:"https://aa-workshop-booking-default-rtdb.europe-west1.firebasedatabase.app",
projectId:"aa-workshop-booking"
};

firebase.initializeApp(firebaseConfig);

const db=firebase.database();

let currentUser=null;

let isStaff=false;

const sessionNames=["Morning","Afternoon","Evening"];

window.onload=()=>{

setupDates();

loadAppData();

refreshGrid();

};

function setupDates(){

const ds=document.getElementById("dateSelect");

for(let i=0;i<5;i++){

let d=new Date();

d.setDate(d.getDate()+i);

if(d.getDay()==0)continue;

let opt=document.createElement("option");

opt.value=d.toISOString().split('T')[0];

opt.text=d.toDateString();

ds.appendChild(opt);

}

}

function loadAppData(){

db.ref('aa_notice').on('value',s=>{

if(s.val())document.getElementById("bulletinText").innerText=s.val();

});

const u=localStorage.getItem("aa_user");

if(u){

currentUser=JSON.parse(u);

document.getElementById("loginBtn").style.display="none";

document.getElementById("logoutBtn").style.display="inline-block";

document.getElementById("dynamicHeader").innerText="Welcome "+currentUser.name.split(' ')[0];

document.getElementById("qrSection").style.display="block";

}

renderWaitlist();

}

function refreshGrid(){

const mainG=document.getElementById("mainGrid");

const yardG=document.getElementById("yardGrid");

const d=document.getElementById("dateSelect").value;

const activeS=document.getElementById("slotSelect").value;

db.ref(`bookings/${d}`).once('value').then(snapshot=>{

const data=snapshot.val()||{};

mainG.innerHTML="";

yardG.innerHTML="";

for(let i=1;i<=25;i++){

const container=document.createElement("div");

container.className="bench-container";

container.innerHTML=`<div>Bench ${i}</div>`;

sessionNames.forEach(s=>{

if(isStaff&&s!==activeS)return;

const b=data[s]?data[s]['bench'+i]:null;

const btn=document.createElement("button");

btn.className="slot-seg "+(b?(b.type==="maint"?"maint":(b.arrived?"arrived":"booked")):"available");

btn.innerText=b?(b.type==="maint"?"🔧":`#${i} ${b.name.split(' ')[0]}`):s;

btn.title=b?b.name:"Available";

const path=`bookings/${d}/${s}/bench${i}`;

btn.onclick=()=>isStaff?handleStaffClick(path,b):handleStudentClick(path,b,s,d);

container.appendChild(btn);

});

if(i<=20)mainG.appendChild(container);

else yardG.appendChild(container);

}

});

}

function checkWaitlistAndFill(path){

db.ref('aa_waitlist').once('value',snap=>{

let list=snap.val()||[];

if(list.length>0){

let next=list.shift();

let newBooking={name:next.name,email:"waitlist-"+Date.now(),arrived:false};

db.ref(path).set(newBooking);

db.ref('aa_waitlist').set(list);

}

});

}

function addToWaitlist(){

const name=document.getElementById("wlName").value.trim();

if(!name)return;

db.ref('aa_waitlist').once('value',snap=>{

let list=snap.val()||[];

list.push({name:name});

db.ref('aa_waitlist').set(list);

});

}

function handleStudentClick(path,b,s,d){

if(!currentUser){openLogin();return;}

if(b){

if(b.email===currentUser.email){

if(confirm("Cancel booking?")){

db.ref(path).remove();

checkWaitlistAndFill(path);

}

}

}else{

db.ref(`bookings/${d}/${s}`).once('value',snap=>{

const data=snap.val()||{};

let already=Object.values(data).some(x=>x.email===currentUser.email);

if(already){alert("One bench per session");return;}

db.ref(path).set({...currentUser,arrived:false});

});

}

}

function handleStaffClick(path,b){

const act=prompt("1 Arrived | 2 Clear | 3 Maintenance");

if(act=="1"&&b)db.ref(path).update({arrived:true});

if(act=="2"){db.ref(path).remove();checkWaitlistAndFill(path);}

if(act=="3")db.ref(path).set({type:"maint",name:"SERVICE"});

}

function renderWaitlist(){

db.ref('aa_waitlist').on('value',snap=>{

const cont=document.getElementById("waitlistContent");

const list=snap.val()||[];

cont.innerHTML="";

list.forEach((item,idx)=>{

const div=document.createElement("div");

div.innerText=item.name;

cont.appendChild(div);

});

});

}

function doLogin(){

const f=document.getElementById("fName").value.trim();

const s=document.getElementById("sName").value.trim();

const p=document.getElementById("loginPass").value.trim();

if(f&&s&&p.toLowerCase()===(f+s).toLowerCase()){

currentUser={

name:f+" "+s,

email:f.toLowerCase()+"."+s.toLowerCase()+"@aaschool.ac.uk"

};

localStorage.setItem("aa_user",JSON.stringify(currentUser));

location.reload();

}

else alert("Login failed");

}

function toggleQR(){

const q=document.getElementById("qrDisplay");

if(q.style.display==="block")q.style.display="none";

else{

q.style.display="block";

document.getElementById("qrcode").innerHTML="";

new QRCode(document.getElementById("qrcode"),{

text:window.location.href.split('?')[0]+"?checkin=true",

width:140,

height:140

});

}

}

function staffLogin(){

if(prompt("PIN")==="workshop123"){

isStaff=true;

document.body.classList.add("staffMode");

document.getElementById("staffSessionUI").style.display="inline";

document.getElementById("staffWlInput").style.display="block";

document.getElementById("staffNoticeTools").style.display="block";

refreshGrid();

}

}

function saveNotice(){

const txt=document.getElementById("noticeInput").value;

db.ref('aa_notice').set(txt);

}

function openLogin(){document.getElementById("loginModal").style.display="flex";}

function closeLogin(){document.getElementById("loginModal").style.display="none";}

function logout(){localStorage.removeItem("aa_user");location.reload();}

</script>

</body>
</html>
